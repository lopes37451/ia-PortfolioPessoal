    <text x="36" y="188" fill="#7C7894">/* Python backend fundamentals &amp; Logic */</text>
    <text x="36" y="212" fill="#38BDF8">def <tspan fill="#F5F3FF">organizar_produtos</tspan>(catalogo):</text>
