<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="100%" height="100%" role="img" aria-label="Composição gráfica vetorial autoral em homenagem ao Sport Club Corinthians Paulista com elementos de campo de futebol e bola geométrica">
  <defs>
    <!-- Gradientes -->
    <linearGradient id="sccp-glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="sccp-radial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.15)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0)"/>
    </radialGradient>
    <filter id="sccp-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- Fundo com grid sutil -->
  <rect width="540" height="320" rx="16" fill="#13131F"/>
  <circle cx="380" cy="160" r="130" fill="url(#sccp-radial)" filter="url(#sccp-blur)"/>

  <!-- Linhas de Campo de Futebol Geométrico (Esquema Tático Autoral) -->
  <g stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" fill="none">
    <!-- Linha lateral e de fundo -->
    <rect x="35" y="35" width="260" height="250" rx="4"/>
    
    <!-- Grande área -->
    <rect x="35" y="85" width="90" height="150"/>
    
    <!-- Pequena área -->
    <rect x="35" y="120" width="40" height="80"/>
    
    <!-- Marca da cal (Pênalti) -->
    <circle cx="95" cy="160" r="3" fill="#FFFFFF"/>
    
    <!-- Arco da grande área -->
    <path d="M 125 125 A 45 45 0 0 1 125 195"/>

    <!-- Meio de campo (Círculo central cortado) -->
    <line x1="295" y1="35" x2="295" y2="285" stroke-dasharray="4 4"/>
    <path d="M 295 110 A 50 50 0 0 0 295 210"/>
    <circle cx="295" cy="160" r="3" fill="#FFFFFF"/>
    
    <!-- Escanteios -->
    <path d="M 35 50 A 15 15 0 0 1 50 35"/>
    <path d="M 35 270 A 15 15 0 0 0 50 285"/>
  </g>

  <!-- Elemento Bola de Futebol Vetorial Geométrica -->
  <g transform="translate(390, 155)">
    <!-- Aura de iluminação -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" stroke-dasharray="6 4"/>
    
    <!-- Base da Bola -->
    <circle cx="0" cy="0" r="56" fill="#1A1A28" stroke="#FFFFFF" stroke-width="2"/>
    
    <!-- Gomos Geométricos Pentágonos e Hexágonos (Estilo Alvinegro) -->
    <!-- Pentágono Central -->
    <polygon points="0,-18 17,-5 11,15 -11,15 -17,-5" fill="#0B0B10" stroke="#FFFFFF" stroke-width="1.5"/>
    
    <!-- Linhas radiais até os vértices externos -->
    <line x1="0" y1="-18" x2="0" y2="-44" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="17" y1="-5" x2="42" y2="-15" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="11" y1="15" x2="28" y2="40" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="-11" y1="15" x2="-28" y2="40" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="-17" y1="-5" x2="-42" y2="-15" stroke="#FFFFFF" stroke-width="1.5"/>

    <!-- Gomos Pretos da Periferia -->
    <path d="M -16 -44 L 16 -44 L 0 -18 Z" fill="#0B0B10"/>
    <path d="M 42 -15 L 48 16 L 11 15 L 17 -5 Z" fill="#0B0B10"/>
    <path d="M -42 -15 L -48 16 L -11 15 L -17 -5 Z" fill="#0B0B10"/>
    <path d="M -18 42 L 18 42 L 0 54 Z" fill="#0B0B10"/>

    <!-- Brilho de acabamento -->
    <path d="M -30 -30 A 45 45 0 0 1 10 -48" stroke="url(#sccp-glow-grad)" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Selo e Tipografia Editorial -->
  <g transform="translate(325, 42)">
    <rect x="0" y="0" width="180" height="26" rx="13" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#38BDF8"/>
    <text x="26" y="17" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#FFFFFF">TIMÃO // 1910</text>
  </g>

  <!-- Tag de Coordenadas Inferiores -->
  <text x="35" y="302" font-family="'JetBrains Mono', monospace" font-size="10" fill="rgba(255, 255, 255, 0.4)">S.C. CORINTHIANS PAULISTA — PAIXÃO &amp; RAÇA</text>
  <text x="505" y="302" font-family="'JetBrains Mono', monospace" font-size="10" fill="rgba(255, 255, 255, 0.4)" text-anchor="end">VAI CORINTHIANS</text>
</svg>
