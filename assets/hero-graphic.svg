<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" width="100%" height="100%" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="heroGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Background Ambient Glow -->
  <circle cx="270" cy="220" r="180" fill="url(#glowGrad)"/>

  <!-- Designer Grid Background Sheet -->
  <rect x="40" y="30" width="460" height="380" rx="20" fill="none" stroke="url(#heroGradient1)" stroke-width="1.5" stroke-opacity="0.3"/>
  <rect x="40" y="30" width="460" height="380" rx="20" fill="url(#gridPattern)" style="color: #8B5CF6;"/>

  <!-- Technical Reticles and Crosshairs -->
  <g stroke="currentColor" stroke-width="1.5" stroke-opacity="0.4" style="color: #38BDF8;">
    <path d="M 30 30 L 50 30 M 40 20 L 40 40"/>
    <path d="M 490 30 L 510 30 M 500 20 L 500 40"/>
    <path d="M 30 410 L 50 410 M 40 400 L 40 420"/>
    <path d="M 490 410 L 510 410 M 500 400 L 500 420"/>
  </g>

  <!-- Abstract UI Artboards / Geometric Layers -->
  <!-- Layer 1: Back Card -->
  <g transform="translate(110, 70)">
    <rect width="320" height="220" rx="14" fill="#151521" fill-opacity="0.85" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <!-- Wireframe Header -->
    <rect x="20" y="20" width="80" height="10" rx="4" fill="#8B5CF6" fill-opacity="0.5"/>
    <circle cx="280" cy="25" r="4" fill="#38BDF8" fill-opacity="0.6"/>
    <circle cx="295" cy="25" r="4" fill="#8B5CF6" fill-opacity="0.6"/>
    <!-- Wireframe Content Blocks -->
    <rect x="20" y="46" width="180" height="8" rx="4" fill="#B7B4C8" fill-opacity="0.2"/>
    <rect x="20" y="62" width="130" height="8" rx="4" fill="#B7B4C8" fill-opacity="0.15"/>
    <!-- Geometric Graph Line -->
    <path d="M 20 170 Q 80 120 150 140 T 290 80" fill="none" stroke="url(#heroGradient1)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="150" cy="140" r="5" fill="#38BDF8"/>
    <circle cx="290" cy="80" r="5" fill="#8B5CF6"/>
  </g>

  <!-- Layer 2: Main Floating Component (UI Card) -->
  <g transform="translate(70, 150)" filter="drop-shadow(0 16px 32px rgba(0,0,0,0.4))">
    <rect width="300" height="210" rx="16" fill="#151521" stroke="url(#heroGradient1)" stroke-width="2"/>
    
    <!-- Window Bar -->
    <rect x="0" y="0" width="300" height="38" rx="16" fill="#1F1F30"/>
    <circle cx="24" cy="19" r="4.5" fill="#EF4444" fill-opacity="0.8"/>
    <circle cx="40" cy="19" r="4.5" fill="#F59E0B" fill-opacity="0.8"/>
    <circle cx="56" cy="19" r="4.5" fill="#10B981" fill-opacity="0.8"/>
    <text x="150" y="24" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#B7B4C8" letter-spacing="1">DESIGN SYSTEM.UI</text>

    <!-- Code / Component Structure -->
    <g transform="translate(24, 56)">
      <!-- Badge Component -->
      <rect x="0" y="0" width="110" height="24" rx="12" fill="#8B5CF6" fill-opacity="0.2" stroke="#8B5CF6" stroke-width="1"/>
      <circle cx="12" cy="12" r="3.5" fill="#8B5CF6"/>
      <text x="24" y="15" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#F5F3FF">INTERFACE</text>

      <!-- Visual Hierarchy Sliders / Metrics -->
      <rect x="0" y="42" width="250" height="6" rx="3" fill="#2A2A40"/>
      <rect x="0" y="42" width="170" height="6" rx="3" fill="url(#heroGradient1)"/>

      <rect x="0" y="60" width="250" height="6" rx="3" fill="#2A2A40"/>
      <rect x="0" y="60" width="120" height="6" rx="3" fill="#38BDF8"/>

      <rect x="0" y="78" width="250" height="6" rx="3" fill="#2A2A40"/>
      <rect x="0" y="78" width="210" height="6" rx="3" fill="#8B5CF6"/>

      <!-- Accent Button in UI -->
      <g transform="translate(0, 102)">
        <rect width="130" height="34" rx="8" fill="url(#heroGradient1)"/>
        <text x="65" y="21" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">EXPERIÊNCIA</text>
      </g>
    </g>
  </g>

  <!-- Layer 3: Floating Geometric Accents -->
  <!-- Glass Pill Floating -->
  <g transform="translate(340, 290)">
    <rect width="150" height="54" rx="27" fill="#1F1F30" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <circle cx="28" cy="27" r="14" fill="#38BDF8" fill-opacity="0.2"/>
    <path d="M 23 27 L 27 31 L 34 23" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="52" y="24" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#F5F3FF">HTML &amp; CSS</text>
    <text x="52" y="38" font-family="'Inter', sans-serif" font-size="9.5" fill="#B7B4C8">ESTRUTURA &amp; ESTILO</text>
  </g>

  <!-- Compass / Golden Ratio Rings -->
  <g transform="translate(420, 120)" stroke="url(#heroGradient1)" stroke-width="1" stroke-dasharray="3 3" opacity="0.6">
    <circle cx="0" cy="0" r="40"/>
    <circle cx="0" cy="0" r="25"/>
    <circle cx="0" cy="0" r="10"/>
  </g>
</svg>
