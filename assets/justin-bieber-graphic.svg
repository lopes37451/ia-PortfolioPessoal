<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="100%" height="100%" role="img" aria-label="Grafismo musical autoral em homenagem a Justin Bieber com disco de vinil estilizado e ondas sonoras">
  <defs>
    <!-- Gradientes -->
    <linearGradient id="jb-grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="jb-disc-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E2E"/>
      <stop offset="50%" stop-color="#2A2A40"/>
      <stop offset="100%" stop-color="#151522"/>
    </linearGradient>
    <radialGradient id="jb-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="jb-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <!-- Fundo com grid sutil -->
  <rect width="540" height="320" rx="16" fill="#13131F"/>
  <circle cx="160" cy="160" r="140" fill="url(#jb-glow)" filter="url(#jb-blur)"/>

  <!-- Linhas de Grid Editorial -->
  <g stroke="rgba(255, 255, 255, 0.05)" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="320"/>
    <line x1="500" y1="0" x2="500" y2="320"/>
    <line x1="0" y1="40" x2="540" y2="40"/>
    <line x1="0" y1="280" x2="540" y2="280"/>
  </g>

  <!-- Disco de Vinil Geométrico -->
  <g transform="translate(160, 160)">
    <!-- Borda externa do vinil -->
    <circle cx="0" cy="0" r="110" fill="url(#jb-disc-grad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2"/>
    
    <!-- Trilhas do disco -->
    <circle cx="0" cy="0" r="95" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1.5" stroke-dasharray="4 2"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
    <circle cx="0" cy="0" r="65" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

    <!-- Centro do Selo (Label) -->
    <circle cx="0" cy="0" r="38" fill="url(#jb-grad-purple)"/>
    <circle cx="0" cy="0" r="32" fill="#0B0B10" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>
    
    <!-- Letras / Monograma Estilizado JB -->
    <text x="0" y="5" font-family="'Space Grotesk', system-ui, sans-serif" font-size="14" font-weight="700" fill="#F5F3FF" text-anchor="middle" letter-spacing="1">JB</text>
    <circle cx="0" cy="0" r="5" fill="#38BDF8"/>

    <!-- Braço do Toca-Discos Estilizado -->
    <path d="M 80 -105 L 45 -40 L 15 -10" fill="none" stroke="#B7B4C8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="80" cy="-105" r="7" fill="#8B5CF6"/>
    <rect x="10" y="-14" width="10" height="8" rx="2" fill="#38BDF8" transform="rotate(-30 15 -10)"/>
  </g>

  <!-- Painel Lateral: Ondas Sonoras e Tipografia -->
  <g transform="translate(310, 75)">
    <!-- Badge de Status -->
    <rect x="0" y="0" width="180" height="26" rx="13" fill="rgba(139, 92, 246, 0.15)" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#8B5CF6"/>
    <text x="26" y="17" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#F5F3FF">NOW PLAYING • JB</text>

    <!-- Frequência / Ondas de Áudio (Equalizador) -->
    <g transform="translate(0, 48)">
      <rect x="0" y="15" width="6" height="45" rx="3" fill="#8B5CF6"/>
      <rect x="12" y="5" width="6" height="55" rx="3" fill="url(#jb-grad-purple)"/>
      <rect x="24" y="25" width="6" height="35" rx="3" fill="#38BDF8"/>
      <rect x="36" y="0" width="6" height="60" rx="3" fill="#8B5CF6"/>
      <rect x="48" y="10" width="6" height="50" rx="3" fill="url(#jb-grad-purple)"/>
      <rect x="60" y="30" width="6" height="30" rx="3" fill="#38BDF8"/>
      <rect x="72" y="8" width="6" height="52" rx="3" fill="#8B5CF6"/>
      <rect x="84" y="20" width="6" height="40" rx="3" fill="url(#jb-grad-purple)"/>
      <rect x="96" y="35" width="6" height="25" rx="3" fill="#38BDF8"/>
      <rect x="108" y="12" width="6" height="48" rx="3" fill="#8B5CF6"/>
      <rect x="120" y="2" width="6" height="58" rx="3" fill="url(#jb-grad-purple)"/>
      <rect x="132" y="22" width="6" height="38" rx="3" fill="#38BDF8"/>
      <rect x="144" y="14" width="6" height="46" rx="3" fill="#8B5CF6"/>
      <rect x="156" y="28" width="6" height="32" rx="3" fill="url(#jb-grad-purple)"/>
      <rect x="168" y="18" width="6" height="42" rx="3" fill="#38BDF8"/>
      <rect x="180" y="8" width="6" height="52" rx="3" fill="#8B5CF6"/>
    </g>

    <!-- Linha de Metadados -->
    <g transform="translate(0, 135)">
      <text x="0" y="0" font-family="'Space Grotesk', system-ui, sans-serif" font-size="14" font-weight="700" fill="#F5F3FF">Inspiração Sonora</text>
      <text x="0" y="20" font-family="'Inter', system-ui, sans-serif" font-size="12" fill="#B7B4C8">Foco, energia &amp; criatividade no design</text>
    </g>
  </g>

  <!-- Tag inferior de coordenadas -->
  <text x="40" y="302" font-family="'JetBrains Mono', monospace" font-size="10" fill="rgba(255, 255, 255, 0.4)">TRACK // 01 — BELIEBER SINCE ALWAYS</text>
  <text x="500" y="302" font-family="'JetBrains Mono', monospace" font-size="10" fill="rgba(255, 255, 255, 0.4)" text-anchor="end">100% VIBE</text>
</svg>
